[theme]
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#F5F8FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#102A43"
font = "sans-serif"
showSidebarBorder = true
chartCategoricalColors = ["#0F766E", "#0891B2", "#7C3AED", "#D97706", "#DC2626", "#475569"]

[server]
headless = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false
